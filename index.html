<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- SEO 文案占位符：构建期由 vite.config.ts 的 copySeoHtmlPlugin 从 src/copy 注入 -->
    <title>{{seo.title}}</title>
    <meta name="description" content="{{seo.description}}" />
    <meta name="keywords" content="{{seo.keywords}}" />
    <link rel="canonical" href="https://www.tingxuan.cn/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="{{seo.siteName}}" />
    <meta property="og:title" content="{{seo.title}}" />
    <meta property="og:description" content="{{seo.ogDescription}}" />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "廷宣科技",
        "alternateName": "Tingxuan Technology",
        "url": "https://www.tingxuan.cn/",
        "description": "企业级 IT 系统安全运维托管与物联网安全解决方案服务商",
        "foundingDate": "2014",
        "areaServed": "CN",
        "knowsAbout": ["物联网安全", "企业系统运维", "零信任架构", "边缘计算安全"],
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+86-400-880-6600",
          "contactType": "sales",
          "availableLanguage": ["zh-CN"]
        }
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
