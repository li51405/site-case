# 发布到 GitHub Pages：推送到 main 分支时自动构建并部署
# 首次使用前需在仓库 Settings → Pages → Source 选择 "GitHub Actions"
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一次部署，取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 项目站点部署在 https://<user>.github.io/site-case/，
      # build:pages 通过 --base 让静态资源与路由基路径与之对齐
      - name: Build
        run: npm run build:pages

      # GitHub Pages 不支持服务端 SPA 回退：复制入口页为 404.html，
      # 直达/刷新子路径（如 /site-case/cases）时也能加载应用
      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
